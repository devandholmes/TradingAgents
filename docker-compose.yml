# One project name from any checkout (worktrees too), so they share the one Postgres volume.
name: tradingagents

services:
  # Postgres for candles, strategy results and analysis runs: docker compose up -d postgres.
  # Credentials come from .env (POSTGRES_USER/PASSWORD/DB); reachable from this machine only.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradingagents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}   # required: the image refuses to start without one
      POSTGRES_DB: ${POSTGRES_DB:-tradingagents}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The dashboard, its strategy engine and the bot, 24/7: docker compose up -d postgres web.
  # Stop the native server first; both would run the bot and want port 8000.
  # The database URL is built from POSTGRES_* (URL-encode a password with :/@?# in it).
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    init: true   # the server is not PID 1: a crash ends the container and the restart policy brings it back
    env_file:
      - .env
    environment:
      TRADINGAGENTS_DATABASE_URL: postgresql://${POSTGRES_USER:-tradingagents}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-tradingagents}
      TRADINGAGENTS_WEB_HOST: 0.0.0.0
      TRADINGAGENTS_WEB_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"   # the Host check allows 127.0.0.1/localhost only
    volumes:
      # trading_state.json, trades.jsonl and the ChatGPT sign-in, as in ~/.tradingagents natively.
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
  pgdata:
